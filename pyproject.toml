[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalogue-service"
version = "1.0.0"
description = "Object Position Server API for satellite catalogues"
authors = [
    {name = "Tim Molteno", email = "tim@elec.ac.nz"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "python-dateutil",
    "flask",
    "flask-cors",
    "sgp4",
    "requests",
    "pytz",
    "waitress",
    "healpy",
    "astropy",
    "h5py",
    "tart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88