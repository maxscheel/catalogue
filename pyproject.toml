
[project]
dependencies = [
    "numpy",
    "python-dateutil",
    "sgp4",
    "requests",
    "pytz",
    "tart",
    # FastAPI dependencies
    "fastapi",
    "uvicorn[standard]",
    "uvloop",
    "skyfield>=1.53",
]
name = "catalogue-service"
version = "1.0.0"
description = "Object Position Server API for satellite catalogues"
authors = [{ name = "Tim Molteno", email = "tim@elec.ac.nz" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "isort", "flake8"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
