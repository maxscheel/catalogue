services:
    fastapi-v2-server:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - 8876:8876
        restart: unless-stopped
        volumes:
            - ~/catalog_cache:/app/orbit_data
            - ./app:/app/app
        command:
            [
                "uvicorn",
                "fastapi_v2:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8876",
                "--loop",
                "uvloop",
                "--access-log",
                "--reload",
                "--workers",
                "1",
            ]
        logging:
            driver: "json-file"
            options:
                max-file: "2"
                max-size: "1m"
